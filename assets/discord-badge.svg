<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-labelledby="title">
  <title id="title">Developer badge</title>
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#6A7CFA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="220" height="220" rx="28" fill="url(#grad)"/>
  <g transform="translate(0,0)" fill="#fff" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" text-anchor="middle">
    <!-- simplified badge icon: braces and chevrons to suggest developer -->
    <g transform="translate(110,90)" fill="#fff" opacity="0.95">
      <path d="M-46 -6 a8 8 0 0 0 0 12 l6 6 a8 8 0 0 0 12-12 L-34 -6  -28 -0" fill="#fff" opacity="0.0"/>
      <g transform="translate(-12,-8)">
        <path d="M0 0 L-10 10 L0 20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <g transform="translate(12,-8)">
        <path d="M0 0 L10 10 L0 20" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
    <text x="110" y="160" font-size="28" font-weight="700" letter-spacing="1">DEVELOPER</text>
    <text x="110" y="186" font-size="12" fill="#eaf0ff" font-weight="600">Sebbeekcode</text>
  </g>
</svg>
